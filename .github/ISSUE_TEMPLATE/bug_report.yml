name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste API keys or tokens.** For security issues, use private vulnerability reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`kfleet doctor --json` output"
      render: json
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: Ubuntu 24.04, Python 3.12

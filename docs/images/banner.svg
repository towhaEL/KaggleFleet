      .m { font-family: 'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace; }
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
